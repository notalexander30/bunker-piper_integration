wall_approach_node:
  ros__parameters:
    aruco_pose_topic: /aruco_single/pose
    point_cloud_topic: /front_camera/depth/color/points
    planning_group: arm
    end_effector_link: front_piper_flange_link
    end_effector_contact_offset: 0.1425
    base_frame: base_link

    clearance: 0.05
    crop_width: 0.30
    crop_height: 0.30
    crop_depth: 0.15
    ransac_distance_threshold: 0.01

    wall_width: 1.0
    wall_height: 1.0
    wall_thickness: 0.02

    velocity_scaling: 0.24
    acceleration_scaling: 0.20
    planning_time: 10.0
    planning_attempts: 10
    goal_position_tolerance: 0.01
    goal_orientation_tolerance: 0.35

    tool_roll: 0.0
    execute: false
    final_clearance: 0.005
    retract_distance: 0.05
    final_velocity_scaling: 0.16
    retract_after: true
    max_final_travel: 0.06
    prefer_elbow_motion: false
    joint1_name: front_piper_joint1
    joint1_planning_tolerances_rad: [0.0]
