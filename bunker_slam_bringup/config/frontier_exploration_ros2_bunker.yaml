frontier_explorer:
  ros__parameters:
    map_topic: /map
    costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap
    navigate_to_pose_action_name: /navigate_to_pose
    global_frame: map
    robot_base_frame: base_link

    frontier_marker_topic: /explore/frontiers
    selected_frontier_topic: /explore/selected_frontier
    optimized_map_topic: /explore/optimized_map
    completion_event_topic: /explore/complete

    map_qos_durability: transient_local
    map_qos_reliability: reliable
    map_qos_depth: 1
    map_qos_autodetect_on_startup: true
    map_qos_autodetect_timeout_s: 2.0
    costmap_qos_reliability: reliable
    costmap_qos_depth: 10
    local_costmap_qos_reliability: inherit
    local_costmap_qos_depth: -1

    autostart: false
    control_service_enabled: true
    completion_event_enabled: true
    return_to_start_on_complete: false
    escape_enabled: true

    map_processing_rate_hz: 0.5
    mrtsp_solver: dp
    dp_solver_candidate_limit: 8
    dp_planning_horizon: 5

    frontier_map_optimization_enabled: true
    goal_preemption_enabled: true
    goal_preemption_min_interval_s: 4.0
    goal_skip_on_blocked_goal: true
    post_goal_settle_enabled: true
    post_goal_min_settle: 2.0

    frontier_suppression_enabled: true
    frontier_suppression_attempt_threshold: 2
    frontier_suppression_no_progress_timeout_s: 25.0
    frontier_suppression_startup_grace_period_s: 20.0
    all_frontiers_suppressed_behavior: stay

    weight_distance_wd: 1.5
    weight_gain_ws: 1.0
    max_linear_speed_vmax: 0.225
    max_angular_speed_wmax: 0.375
    sensor_effective_range_m: 3.0

    frontier_selection_min_distance: 0.8
    frontier_visit_tolerance: 0.45
    frontier_candidate_min_goal_distance_m: 0.8
    front_sensor_frontier_filter_enabled: true
    front_sensor_frontier_fov_deg: 87.0
    front_sensor_frontier_yaw_offset_deg: 0.0
    front_sensor_frontier_allow_fallback: false
    occ_threshold: 65
    min_frontier_size_cells: 8
    sigma_s: 2.0
    sigma_r: 30.0
    dilation_kernel_radius_cells: 1

    goal_preemption_complete_if_within_m: 0.55
    goal_preemption_lidar_range_m: 4.0
    goal_preemption_lidar_fov_deg: 87.0
    goal_preemption_lidar_ray_step_deg: 2.0
    goal_preemption_lidar_min_reveal_length_m: 0.4
    goal_preemption_lidar_yaw_offset_deg: 0.0

frontier_debug_observer:
  ros__parameters:
    debug_update_rate_hz: 1.0
    debug_labels_enabled: true
    debug_label_top_n: 20
    debug_edge_top_n: 10
