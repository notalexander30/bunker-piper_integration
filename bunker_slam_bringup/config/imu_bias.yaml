imu_bias_corrector:
  ros__parameters:
    input_topic: /camera/camera/imu
    output_topic: /camera/camera/imu/bias_corrected
    wheel_odometry_topic: /wheel/odometry

    # At 200 Hz this is about five seconds, after the one-second stationary
    # hold. No corrected IMU is published until a clean batch is accepted.
    calibration_samples: 1000
    stationary_hold_seconds: 1.0
    wheel_message_timeout_seconds: 0.25
    stationary_linear_speed_threshold: 0.01
    stationary_angular_speed_threshold: 0.01

    # Per-axis limits in rad/s. A batch exceeding either limit is discarded.
    max_standard_deviation: [0.02, 0.02, 0.02]
    max_absolute_bias: [0.05, 0.05, 0.05]

    # rad^2/s^2. Accepted-batch variance is added to the greater of this floor
    # and the camera-reported diagonal variance.
    angular_covariance_floor: 0.0001
